# Netlify: either drag the dist/ folder onto https://app.netlify.com/drop,
# or connect this folder/repo and Netlify will run the build below.
[build]
  command = "node build.mjs"
  publish = "dist"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
